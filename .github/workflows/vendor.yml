name: Vendor tree
on:
  pull_request:
    paths:
      - 'composer.json'
      - 'composer.lock'
      - 'vendor/**'
      - 'bin/check-vendor.sh'
      - '.github/workflows/vendor.yml'
  workflow_dispatch:
jobs:
  vendor:
    name: The committed vendor tree matches the lock and Strauss
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.2'
          coverage: none
      - run: bin/check-vendor.sh
