name: 'PHP Compatibility'
on:
  pull_request:
    paths:
      - 'wp-admin-ui/**.php'
      - '*.php'
      - 'composer.json'
      - '.github/workflows/php-compatibility.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  phpcs-compatibility:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Get Composer Cache Directory
        id: composer-cache
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1
        with:
          composer-options: "--no-scripts"

      # ------------------------------------------------------------------------------
      # Get changed files (the plugin's own PHP; vendor/ is third-party code)
      # ------------------------------------------------------------------------------
      - name: Get list of changed files
        run: |
          echo "CHANGED_FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.php$' | grep -v '^vendor/' | paste -sd' ' - || true)" >> $GITHUB_ENV

      # ------------------------------------------------------------------------------
      # PHPCompatibilityWP (.phpcs.compat.xml), reported on the pull request like PHPCS
      # ------------------------------------------------------------------------------
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Run PHPCompatibility inspection
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GH_BOT_TOKEN || github.token }}
        run: |
          if [ -z "${CHANGED_FILES}" ]; then echo "No PHP files changed."; exit 0; fi
          ( vendor/bin/phpcs --standard=.phpcs.compat.xml --report=json ${CHANGED_FILES} || true ) | jq -r ' .files | to_entries[] | .key as $path | .value.messages[] as $msg | "\($path):\($msg.line):\($msg.column):`\($msg.source)`<br>\($msg.message)" ' | reviewdog -efm="%f:%l:%c:%m" -name="phpcompatibility" -filter-mode="added" -fail-level=any -reporter=github-pr-review
          # The PDF export class is excluded above (it needs PHP 8.2); it gets its own run at that floor.
          pdf_class="wp-admin-ui/includes/class-exports-reports-admin-ui-export-pdf.php"
          if grep -qx "$pdf_class" <<< "$(tr ' ' '\n' <<< "${CHANGED_FILES}")"; then
            ( vendor/bin/phpcs --standard=.phpcs.compat-pdf.xml --report=json "$pdf_class" || true ) | jq -r ' .files | to_entries[] | .key as $path | .value.messages[] as $msg | "\($path):\($msg.line):\($msg.column):`\($msg.source)`<br>\($msg.message)" ' | reviewdog -efm="%f:%l:%c:%m" -name="phpcompatibility-pdf" -filter-mode="added" -fail-level=any -reporter=github-pr-review
          fi
