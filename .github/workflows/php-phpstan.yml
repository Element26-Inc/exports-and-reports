name: 'PHP Static Analysis'
on:
  pull_request:
    paths:
      - 'wp-admin-ui/**.php'
      - '*.php'
      - 'composer.json'
      - 'phpstan.neon'
      - 'phpstan-baseline.neon'
      - '.github/workflows/php-phpstan.yml'
jobs:
  phpstan:
    strategy:
      matrix:
        phpVersion: [
          "7.4",
          "8.0",
          "8.1",
          "8.2",
          "8.3",
          "8.4"
        ]
    runs-on: ubuntu-24.04
    steps:
      # ------------------------------------------------------------------------------
      # Checkout the repository
      # ------------------------------------------------------------------------------
      - name: Checkout the repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      # ------------------------------------------------------------------------------
      # The plugin's own changed PHP files (vendor/ is third-party code). A change to the
      # configuration, the baseline, the dependencies or this workflow analyses every path in
      # phpstan.neon instead, which is what keeps the baseline honest.
      # ------------------------------------------------------------------------------
      - name: Decide what to analyse
        id: changed-files
        run: |
          changed="$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }})"
          if grep -qxE 'phpstan\.neon|phpstan-baseline\.neon|composer\.json|\.github/workflows/php-phpstan\.yml' <<< "$changed"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "paths=" >> "$GITHUB_OUTPUT"
          else
            paths="$(grep '\.php$' <<< "$changed" | grep -v '^vendor/' | paste -sd' ' - || true)"
            echo "run=$([ -n "$paths" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
            echo "paths=$paths" >> "$GITHUB_OUTPUT"
          fi
      # ------------------------------------------------------------------------------
      # Set up PHP and run phpstan
      # ------------------------------------------------------------------------------
      - name: Configure PHP environment to run phpstan
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.phpVersion }}
      # ------------------------------------------------------------------------------
      # Override composer php version
      # ------------------------------------------------------------------------------
      - name: Set php version ${{ matrix.phpVersion }} in composer
        run: composer config platform.php ${{ matrix.phpVersion }}
      # ------------------------------------------------------------------------------
      # Install dependencies for the matrix PHP version (upper bounds ignored). 7.4 is below the
      # plugin's own requirement, so that job relaxes it in the runner before resolving.
      # ------------------------------------------------------------------------------
      - name: Install dependencies
        run: |
          if [ "${{ matrix.phpVersion }}" = "7.4" ]; then composer require --no-update --no-interaction "php:>=7.4"; fi
          composer i --ignore-platform-req=php+
      # ------------------------------------------------------------------------------
      # Run phpstan
      # ------------------------------------------------------------------------------
      - name: Run phpstan
        if: steps.changed-files.outputs.run == 'true'
        run: ./vendor/bin/phpstan analyse --error-format=table -c phpstan.neon ${{ steps.changed-files.outputs.paths }}