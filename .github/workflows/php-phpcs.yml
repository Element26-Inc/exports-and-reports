name: 'PHP CodeSniffer'
on:
  pull_request:
    paths:
      - 'wp-admin-ui/**.php'
      - '*.php'
      - 'composer.json'
      - '.github/workflows/php-phpcs.yml'
permissions:
  contents: read
  pull-requests: write
jobs:
  phpcs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # ------------------------------------------------------------------------------
      # Prepare our cache directories
      # ------------------------------------------------------------------------------
      - name: Get Composer Cache Directory
        id: get-composer-cache-dir
        run: |
          echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        id: composer-cache
        with:
          path: ${{ steps.get-composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: 8.3
      - uses: ramsey/composer-install@a8d0d959dab41457692a5e2041bd9b757a119e3f # 3.2.1

      # ------------------------------------------------------------------------------
      # The whole plugin (the files phpcs.xml lists), not only the changed lines
      # ------------------------------------------------------------------------------
      - name: Sniff the whole plugin
        run: vendor/bin/phpcs --standard=phpcs.xml

      # ------------------------------------------------------------------------------
      # Get changed files (the plugin's own PHP; vendor/ is third-party code)
      # ------------------------------------------------------------------------------
      - name: Get list of changed files
        id: files
        run: |
          echo "CHANGED_FILES=$(git diff --name-only --diff-filter=AM ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} | grep '\.php$' | grep -v '^vendor/' | paste -sd' ' - || true)" >> $GITHUB_ENV

      # ------------------------------------------------------------------------------
      # PHPCS, reported on the pull request; the repository token serves when no bot token is set
      # ------------------------------------------------------------------------------
      - uses: reviewdog/action-setup@d8edfce3dd5e1ec6978745e801f9c50b5ef80252 # v1.4.0
        with:
          reviewdog_version: latest
      - name: Run reviewdog
        env:
          REVIEWDOG_GITHUB_API_TOKEN: ${{ secrets.GH_BOT_TOKEN || github.token }}
        run: |
          if [ -z "${CHANGED_FILES}" ]; then echo "No PHP files changed."; exit 0; fi
          ( vendor/bin/phpcs --report=json ${CHANGED_FILES} || true ) | jq -r ' .files | to_entries[] | .key as $path | .value.messages[] as $msg | "\($path):\($msg.line):\($msg.column):`\($msg.source)`<br>\($msg.message)" ' | reviewdog -efm="%f:%l:%c:%m" -name="phpcs" -filter-mode="added" -fail-level=any -reporter=github-pr-review
